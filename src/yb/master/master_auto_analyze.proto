syntax = "proto3";

package yb.master;

option java_package = "org.yb.master";

import "yb/common/wire_protocol.proto";
import "yb/master/master_types.proto";
import "yb/rpc/service.proto";

message TablIdMutationCountPairPB {
    string table_id = 1;
    uint64 mutation_count = 2;
}

message IncreaseMutationCountersRequestPB {
    repeated TablIdMutationCountPairPB table_mutation_counts = 1;
}

message IncreaseMutationCountersResponsePB {
    MasterErrorPB error = 1;

    // If errors occurred with particular table mutation increments, then the errors
    // for those operations will be passed back in 'per_table_errors'.
    message PerTableErrorPB {
        // The index of the table in the incoming batch.
        uint32 table_index = 1;
        // The error that occurred.
        AppStatusPB error = 2;
    }
    repeated PerTableErrorPB per_table_errors = 2;
}

service MasterAutoAnalyze {
    option (yb.rpc.custom_service_name) = "yb.master.MasterService";

    rpc IncreaseMutationCounters(IncreaseMutationCountersRequestPB)
        returns (IncreaseMutationCountersResponsePB);
}
