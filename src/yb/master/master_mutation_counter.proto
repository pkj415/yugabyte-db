syntax = "proto2";

package yb.master;

option java_package = "org.yb.master";

import "yb/master/master_types.proto";
import "yb/rpc/service.proto";

// TODOVELIOGLU: Make it repeated of another PG (though it failed on my first try)
message MutationCounterRequestPB {
    repeated string table_id = 1;
    repeated uint64 mutation_count = 2;
}

message MutationCounterResponsePB {
    optional MasterErrorPB error = 1;
}

service MasterMutationCounter {
    option (yb.rpc.custom_service_name) = "yb.master.MasterService";

    // TS-> Master RPCs
    rpc IncremenentMutationCounter(MutationCounterRequestPB) returns (MutationCounterResponsePB);
}
